name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp "$(ls *.html | head -1)" www/index.html

      - name: Fix back button
        run: |
          cat > snippet.html <<'SNIP'
          <script>
          (function(){
            var C=window.Capacitor,A=C&&C.Plugins&&C.Plugins.App;
            if(!A)return;
            A.addListener('backButton',function(){
              window.dispatchEvent(new PopStateEvent('popstate'));
            });
            var y=document.getElementById('xy');
            if(y)y.addEventListener('click',function(){
              setTimeout(function(){A.exitApp()},300);
            });
          })();
          </script>
          SNIP
          python3 -c "p='www/index.html';s=open(p,encoding='utf-8').read();n=open('snippet.html',encoding='utf-8').read();i=s.rfind('</body>');s=s[:i]+n+s[i:] if i>=0 else s+n;open(p,'w',encoding='utf-8').write(s)"

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/app@6

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: odds-calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
